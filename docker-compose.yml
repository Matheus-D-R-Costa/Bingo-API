services:

  mailcatcher:
    image: dockage/mailcatcher:0.9
    ports:
      - "1025:1025"
      - "1080:1080"
    networks:
      - bingo-net

  db:
    image: mongo:latest
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo-admin
      MONGO_INITDB_ROOT_PASSWORD: neymar
      MONGO_INITDB_DATABASE: Bingo
    ports:
      - "27017:27017"
    networks:
      - bingo-net

  mongo-express:
    image: mongo-express:latest
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: mongo-admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: neymar
      ME_CONFIG_MONGODB_URL: mongodb://mongo-admin:neymar@db:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - db
    networks:
      - bingo-net

volumes:
  db:

networks:
  bingo-net:
    name: bingo-net
